<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Tekenapp Fiber</title>
<style>
:root{--brand:#C00000;--brand-dark:#8A0000;--bg:#f1f3f5;--panel:#fff;--line:#e2e5ea;--text:#1c2024;--accent:#0B4EA2}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden;overscroll-behavior:none;position:fixed;width:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;height:100dvh}
button{touch-action:manipulation;user-select:none;-webkit-user-select:none;font-family:inherit}

.toolbar{flex:0 0 auto;background:#fff;border-bottom:1px solid var(--line);padding-top:calc(4px + env(safe-area-inset-top));padding-bottom:4px}
.tbar-row{display:flex;gap:6px;align-items:center;padding:4px 8px;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;white-space:nowrap;scrollbar-width:none}
.tbar-row::-webkit-scrollbar{display:none}
.tbar-sep{width:1px;height:24px;background:var(--line);flex-shrink:0;margin:0 2px}

.btn{border:none;background:var(--brand);color:#fff;border-radius:8px;padding:0 12px;font-size:14px;font-weight:600;cursor:pointer;height:40px;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center}
.btn:active{background:var(--brand-dark)}
.btn:disabled{opacity:.4}
.btn.active{background:#fff;color:var(--brand-dark);border:2px solid var(--brand-dark);padding:0 10px}
.icon-btn{width:40px;height:40px;padding:0;border:1px solid var(--line);background:#fff;color:#333;border-radius:8px;font-size:18px;cursor:pointer;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center}
.icon-btn:active{background:#f1f3f5}
.icon-btn:disabled{opacity:.35;cursor:not-allowed}
.icon-btn.danger{color:#C00000;font-size:20px}
.icon-btn.danger:not(:disabled):active{background:#fdecec;border-color:#e8b5b5}

.ltype-btn{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:64px;height:40px;padding:0 8px;border:2px solid var(--line);background:#fff;border-radius:8px;cursor:pointer;flex-shrink:0}
.ltype-btn.active{border-color:var(--accent);background:#EAF2FB}
.ltype-btn .swatch{width:52px;height:4px;border-radius:0;flex-shrink:0}
.ltype-btn .swatch.thin{height:3px}
.ltype-btn .swatch.dashed{height:4px}
.ltype-btn .swatch.dashed.thin{height:3px}
.ltype-btn .swatch.dashed.black{background-image:repeating-linear-gradient(90deg,#000 0 8px,transparent 8px 14px)}
.ltype-btn .swatch.dashed.brown{background-image:repeating-linear-gradient(90deg,#A0522D 0 8px,transparent 8px 14px)}
.ltype-btn .swatch.dashed.green{background-image:repeating-linear-gradient(90deg,#00B050 0 8px,transparent 8px 14px)}
.ltype-btn .swatch.dashed.orange{background-image:repeating-linear-gradient(90deg,#FFC000 0 6px,transparent 6px 11px)}
.ltype-btn .lbl{font-size:8px;color:#555;line-height:1;letter-spacing:.2px}

.yt-btn{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:64px;height:40px;padding:0 10px;border:2px solid #FFE082;background:#FFFDE7;border-radius:8px;cursor:pointer;flex-shrink:0}
.yt-btn:active{background:#FFF3C4}
.yt-btn.active{border-color:#B58500;background:#FFF3C4}
.yt-btn .yt-txt{font-size:11px;font-weight:800;color:#8A6A00;line-height:1}
.yt-btn .yt-lbl{font-size:8px;color:#666;line-height:1;letter-spacing:.2px}

#main{flex:1;min-height:0;display:grid;grid-template-columns:82px 1fr;overflow:hidden}
#symbol-bar{background:#fff;border-right:1px solid var(--line);overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:4px 3px;display:flex;flex-direction:column;gap:4px}
#symbol-bar::-webkit-scrollbar{width:0}
.sym-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:5px 2px;border:2px solid var(--line);background:#fff;border-radius:8px;cursor:pointer;min-height:58px;flex-shrink:0}
.sym-btn:active{background:#f1f3f5}
.sym-btn.active{border-color:var(--accent);background:#EAF2FB}
.sym-btn svg{display:block}
.sym-btn .lbl{font-size:8px;color:#444;text-align:center;line-height:1;letter-spacing:.1px;padding:0 1px}
.sym-sep{height:1px;background:var(--line);margin:4px 2px;flex-shrink:0;grid-column:1/-1}
.sym-btn.floor-btn{background:#FFFDE7;border-color:#FFE082;min-height:46px}
.sym-btn.floor-btn.active{background:#FFF3C4;border-color:#B58500}
.sym-btn.floor-btn svg{width:24px;height:24px}

#canvas-wrapper{overflow:auto;background:#e9ecef;position:relative;-webkit-overflow-scrolling:touch;user-select:none;-webkit-user-select:none;touch-action:pan-x pan-y}
#canvas-wrapper.drawing{touch-action:none;overflow:hidden}
#stage{display:block;user-select:none;-webkit-user-select:none}

@media (orientation: landscape) and (min-width: 900px){
  #main{grid-template-columns:180px 1fr}
  #symbol-bar{display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:6px;align-content:start}
  .sym-btn{min-height:64px;padding:6px 3px}
  .sym-btn svg{width:36px;height:36px}
  .sym-btn .lbl{font-size:9px}
  .sym-btn.floor-btn{min-height:50px}
  .sym-btn.floor-btn svg{width:26px;height:26px}
  .btn{padding:0 14px}
  .ltype-btn{min-width:74px}
  .ltype-btn .swatch{width:60px}
  .yt-btn{min-width:74px}
}
@media (orientation: landscape) and (min-width: 1200px){
  #main{grid-template-columns:220px 1fr}
  .ltype-btn{min-width:86px}
  .ltype-btn .swatch{width:72px}
  .yt-btn{min-width:86px}
}

.bottom-bar{flex:0 0 auto;display:flex;gap:6px;align-items:center;padding:6px 10px;padding-bottom:calc(6px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line);z-index:100}
.bb-btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:0 12px;height:44px;min-width:50px;font-size:16px;font-weight:700;cursor:pointer;color:#333;display:inline-flex;align-items:center;justify-content:center;gap:6px;flex-shrink:0}
.bb-btn:active{background:#f1f3f5}
.bb-btn:disabled{opacity:.35}
.bb-btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
.bb-btn.add{background:var(--accent);color:#fff;border-color:var(--accent);font-size:22px;font-weight:800}
.bb-btn.danger{background:#fff;color:#C00000;border-color:#e8b5b5}
.bb-btn .ico{font-size:18px;line-height:1}
.bb-info{font-size:13px;color:#666;padding:0 10px;font-weight:600;margin-left:auto;white-space:nowrap}

.panel{position:fixed;top:0;bottom:0;width:min(90vw,380px);z-index:2000;background:#fff;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 8px 32px rgba(0,0,0,.3);transition:transform .25s ease;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
.panel-left{left:0;transform:translateX(-105%)}
.panel-right{right:0;transform:translateX(105%)}
body.drawer-left .panel-left{transform:translateX(0)}
body.drawer-right .panel-right{transform:translateX(0)}
.panel-head{display:flex;align-items:center;justify-content:space-between;padding:12px;border-bottom:1px solid var(--line);font-weight:700;flex-shrink:0}
.close-x{border:none;background:transparent;font-size:20px;cursor:pointer;width:38px;height:38px;border-radius:8px}
.close-x:active{background:#f1f3f5}
.panel .content{padding:12px;overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch}
#backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1500;display:none}
body.drawer-left #backdrop,body.drawer-right #backdrop{display:block}

.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.row:last-child{margin-bottom:0}
.row strong{font-size:14px}
.small{font-size:12px;color:#6b7280}
hr.sep{margin:14px 0;border:none;border-top:1px solid var(--line)}
label.check{display:flex;align-items:center;gap:8px;font-size:14px;min-height:34px}
input[type=text]{padding:9px 10px;border:1px solid var(--line);border-radius:8px;font-size:14px;width:100%;background:#fff}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--brand)}
.hidden{display:none!important}
.thumbs{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;max-height:200px;overflow-y:auto}
.thumb-btn{padding:7px 11px;border:1px solid var(--line);border-radius:6px;background:#fff;cursor:pointer;font-weight:600;font-size:13px;min-width:38px;min-height:36px}
.thumb-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.pen-indicator{display:inline-flex;align-items:center;gap:6px;padding:0 10px;height:40px;border-radius:20px;background:#f1f3f5;font-size:12px;font-weight:600;color:#666;flex-shrink:0}
.pen-indicator.active{background:#4EA72E;color:#fff}
.pen-dot{width:8px;height:8px;border-radius:50%;background:currentColor}
.mode-indicator{padding:0 12px;height:40px;border-radius:8px;background:#FFF3CD;color:#856404;font-weight:600;font-size:12px;flex-shrink:0;border:1px solid #FFE69C;display:inline-flex;align-items:center}
.hint{background:#EAF2FB;border:1px solid #b8d4f0;border-radius:8px;padding:10px;font-size:13px;color:#1a4a7a;margin-bottom:12px}

#mini-error-console{position:fixed;right:8px;bottom:80px;max-width:min(42ch,80vw);max-height:30vh;overflow:auto;font:11px/1.35 ui-monospace,Menlo,monospace;background:#111;color:#f66;padding:8px 10px;border-radius:10px;z-index:999999;white-space:pre-wrap;pointer-events:none;opacity:0;transition:opacity .3s;box-shadow:0 6px 18px rgba(0,0,0,.35)}
#mini-error-console.show{opacity:1}
#mini-error-console b{color:#fff}
</style>
</head>
<body>

<div class="toolbar">
  <div class="tbar-row">
    <button id="toggle-left" class="icon-btn" title="Foto's">☰</button>
    <button id="tool-select" class="btn active">Select</button>
    <button id="tool-line" class="btn">Lijn</button>
    <button id="tool-arrow" class="btn">Pijl</button>
    <button id="tool-text" class="btn">Tekst</button>
    <div class="tbar-sep"></div>
    <button id="btn-undo" class="btn" disabled>Undo</button>
    <button id="btn-redo" class="btn" disabled>Redo</button>
    <button id="btn-del-top" class="icon-btn danger" title="Verwijder selectie" disabled>🗑</button>
    <span id="modeIndicator" class="mode-indicator hidden">Symbool…</span>
    <div style="flex:1"></div>
    <span class="pen-indicator" id="penIndicator"><span class="pen-dot"></span>Pen</span>
    <button id="toggle-right" class="icon-btn" title="Acties">⚙</button>
  </div>
  <div class="tbar-row" id="linetype-row"></div>
</div>

<div id="main">
  <aside id="symbol-bar"></aside>
  <main id="canvas-wrapper"><div id="stage"></div></main>
</div>

<div class="bottom-bar">
  <button id="bb-add" class="bb-btn add" title="Foto's toevoegen">＋</button>
  <button id="bb-prev" class="bb-btn" title="Vorige foto"><span class="ico">←</span></button>
  <button id="bb-next" class="bb-btn" title="Volgende foto"><span class="ico">→</span></button>
  <button id="bb-export" class="bb-btn primary" title="Download huidige foto"><span class="ico">📥</span></button>
  <button id="bb-delete" class="bb-btn danger" title="Verwijder huidige foto"><span class="ico">🗑</span></button>
  <span class="bb-info" id="bb-info">– / –</span>
</div>

<aside id="panel-left" class="panel panel-left">
  <div class="panel-head"><span>Foto's</span><button class="close-x" data-close="left">✕</button></div>
  <div class="content">
    <div class="hint">Tik op <b>＋</b> onderaan om foto's toe te voegen.</div>
    <div class="row">
      <button id="btn-prev" class="btn">← Vorige</button>
      <button id="btn-next" class="btn">Volgende →</button>
    </div>
    <div id="thumbs" class="thumbs"></div>
    <hr class="sep">
    <div class="row"><strong>Opties</strong></div>
    <label class="check"><input type="checkbox" id="snapToggle" checked> Snap naar lijnen</label>
    <label class="check"><input type="checkbox" id="penOnlyToggle" checked> Alleen pen (palm rejection)</label>
    <div class="small" style="margin-top:4px">Zet <b>Scribble</b> uit in iPad Instellingen → Apple Pencil.</div>
  </div>
</aside>

<aside id="panel-right" class="panel panel-right">
  <div class="panel-head"><span>Acties</span><button class="close-x" data-close="right">✕</button></div>
  <div class="content">
    <div class="row"><strong>Huidig beeld</strong></div>
    <div class="small" id="current-name" style="word-break:break-all">–</div>
    <hr class="sep">
    <div class="row">
      <button id="btn-rename-photo" class="btn">Hernoem</button>
      <button id="btn-remove-photo" class="btn">Verwijder foto</button>
    </div>
    <div class="row">
      <button id="btn-clear-queue" class="btn">Verwijder alle foto's</button>
    </div>
    <hr class="sep">
    <div class="row"><strong>Lagen</strong></div>
    <div class="row">
      <button id="btn-up" class="btn" disabled>Omhoog</button>
      <button id="btn-down" class="btn" disabled>Omlaag</button>
    </div>
    <div class="row">
      <button id="btn-clear" class="btn">Alles wissen</button>
    </div>
    <hr class="sep">
    <div class="row"><strong>Exporteren</strong></div>
    <div class="row">
      <button id="btn-export" class="btn">Export JPEG</button>
      <button id="btn-export-all" class="btn">Export alles (ZIP)</button>
    </div>
    <div class="hint" id="dirHint" style="display:none">Op dit toestel kun je een map kiezen als bestemming.</div>
    <label class="check"><input type="checkbox" id="includeProjectJson"> Project.json meesturen</label>
    <hr class="sep">
    <div class="row"><strong>Project</strong></div>
    <div class="row">
      <label class="small" for="projectName" style="min-width:60px">Naam:</label>
      <input id="projectName" type="text" placeholder="bv. Wyre_MRO" />
    </div>
    <div class="row">
      <button id="btn-export-project" class="btn">Opslaan</button>
      <button id="btn-load-project" class="btn">Laden</button>
      <input id="project-input" class="hidden" type="file" accept="application/json">
    </div>
  </div>
</aside>

<div id="backdrop"></div>
<input id="file-input" class="hidden" type="file" accept="image/*" multiple>
<div id="mini-error-console" aria-live="polite">OK</div>

<script src="https://unpkg.com/konva@9/konva.min.js"></script>
<script>window.Konva||document.write('<script src="https://cdn.jsdelivr.net/npm/konva@9/konva.min.js"><\/script>');</script>
<script>window.Konva||document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/konva/9.3.16/konva.min.js"><\/script>');</script>

<script>
(function(){
'use strict';

if(typeof Konva !== 'undefined'){
  if(typeof Konva.pixelRatio !== 'undefined') Konva.pixelRatio = 1;
}

function toArr(x){
  if(!x) return [];
  if(Array.isArray(x)) return x;
  if(typeof x.toArray === 'function'){ try{ return x.toArray(); }catch(e){} }
  if(typeof x.length === 'number') return Array.prototype.slice.call(x);
  return [];
}
function layerChildrenNoTransformer(){
  return toArr(drawLayer.getChildren()).filter(n => n !== transformer);
}

const errBox = document.getElementById('mini-error-console');
let errTimer = null;
function logErr(kind, msg){
  if(!errBox) return;
  const d = document.createElement('div');
  d.innerHTML = '<b>'+kind+':</b> '+String(msg||'');
  errBox.appendChild(d);
  errBox.classList.add('show');
  clearTimeout(errTimer);
  errTimer = setTimeout(()=>errBox.classList.remove('show'), 4000);
}
window.addEventListener('error', e => logErr('Error', (e.message||'')+' @ '+((e.filename||'').split('/').pop())+':'+(e.lineno||'')));
window.addEventListener('unhandledrejection', e => logErr('Promise', String(e.reason||'unknown')));

if(typeof Konva === 'undefined'){
  document.body.innerHTML = '<div style="padding:40px;font-family:-apple-system,sans-serif"><h1>Konva niet geladen</h1><p>Controleer internet en herlaad.</p></div>';
  return;
}

const LINE_TYPES = {
  publiek:   { label:'PUBLIEK',   color:'#000000', width:8, dash:[16,12], dashedClass:'black',  pointerLen:18 },
  prive:     { label:'PRIVÉ',     color:'#A0522D', width:6, dash:[16,12], dashedClass:'brown',  pointerLen:14 },
  gevel:     { label:'GEVEL',     color:'#7030A0', width:6, dash:null,                          pointerLen:14 },
  gem_zicht: { label:'GEM ZIEN',  color:'#00B050', width:6, dash:null,                          pointerLen:14 },
  gem_niet:  { label:'GEM NIET',  color:'#00B050', width:6, dash:[14,10], dashedClass:'green',  pointerLen:14 },
  ind_zicht: { label:'IND ZIEN',  color:'#FFC000', width:3, dash:null,                          pointerLen:7  },
  ind_niet:  { label:'IND NIET',  color:'#FFC000', width:3, dash:[10,7],  dashedClass:'orange', pointerLen:7  },
};

const YT_BUTTONS = [
  { key:'wachtbuis', text:'Wachtbuis aanwezig', shortTxt:'WACHTBUIS', subLbl:'aanwezig' },
  { key:'gleuf',     text:'gleuf',              shortTxt:'GLEUF',     subLbl:'' },
];

const SYMBOLS = {
  intrede_onder: { label:'Ondergronds', kind:'triangle', color:'#1E88E5' },
  intrede_boven: { label:'Bovengronds', kind:'triangle', color:'#7030A0' },
  verdeelpunt:   { label:'Verdeelpunt', kind:'diamond',  color:'#FFE600' },
  verdeeldoos:   { label:'Verdeeldoos', kind:'square',   color:'#00B050' },
  ftu:           { label:'FTU',         kind:'square',   color:'#FFC000' },
  boorgat:       { label:'Boorgat',     kind:'circle',   color:'#E00000' },
  LU:            { label:'LU',          kind:'label',    color:'#FFE600', bg:'#FFE600', fg:'#000', text:'LU', w:48, h:30, fs:15 },
  BU:            { label:'BU',          kind:'label',    color:'#FFE600', bg:'#FFE600', fg:'#000', text:'BU', w:48, h:30, fs:15 },
};
/* Verdiepingen -1 t/m +10 — 0 zonder + teken */
for(let f = -1; f <= 10; f++){
  SYMBOLS['floor_' + f] = {
    label: 'Verdieping ' + (f > 0 ? ('+' + f) : String(f)),
    shortLabel: (f > 0 ? ('+' + f) : String(f)),
    kind: 'floor',
    color: '#FFC000',
    floorValue: f,
  };
}

const TEXT_COLOR = '#FFC000';

let imageFiles = [];
let currentIndex = -1;
let currentId = null;
const scenes = {};
const history = {};
let currentLineType = 'publiek';
let currentTool = 'select';
let pendingSymbol = null;
let selectedNode = null;
let currentShape = null;
let isDirty = false;
const EMPTY_JSON = '[]';
function setDirty(){ isDirty = true; }

let STAGE_W = 800, STAGE_H = 600;
const stage = new Konva.Stage({ container:'stage', width:STAGE_W, height:STAGE_H, listening:true, hitGraphEnabled:true, perfectDrawEnabled:false });
const bgLayer = new Konva.Layer({ listening:false, hitGraphEnabled:false });
const drawLayer = new Konva.Layer({ listening:true });
stage.add(bgLayer); stage.add(drawLayer);

const bgImageNode = new Konva.Image({ listening:false, draggable:false, perfectDrawEnabled:false, shadowForStrokeEnabled:false });
bgLayer.add(bgImageNode);

const transformer = new Konva.Transformer({
  rotateEnabled:true,
  rotationSnaps:[0,45,90,135,180,225,270,315],
  enabledAnchors:['top-left','top-right','bottom-left','bottom-right','rotater'],
  padding:4, borderStroke:'#0B4EA2', borderStrokeWidth:1.5,
  anchorSize:18, anchorCornerRadius:10,
  anchorStroke:'#0B4EA2', anchorFill:'#fff',
  rotateAnchorOffset:48, ignoreStroke:true, shouldOverdrawWholeArea:false,
  boundBoxFunc:(oldBox, newBox) => newBox.width < 20 || newBox.height < 20 ? oldBox : newBox,
});
drawLayer.add(transformer);

function sizeToWrapper(){
  const wrap = document.getElementById('canvas-wrapper');
  if(!wrap) return;
  STAGE_W = Math.max(200, wrap.clientWidth);
  STAGE_H = Math.max(200, wrap.clientHeight);
  stage.size({ width:STAGE_W, height:STAGE_H });
  stage.container().style.width = STAGE_W + 'px';
  stage.container().style.height = STAGE_H + 'px';
}
function resizeStage(w,h){
  stage.size({ width:w, height:h });
  stage.container().style.width = w+'px';
  stage.container().style.height = h+'px';
}

const btnDelTop = document.getElementById('btn-del-top');

function selectNode(n){
  selectedNode = n;
  transformer.nodes(n ? [n] : []);
  transformer.visible(!!n);
  transformer.moveToTop();
  drawLayer.batchDraw();
  updateZButtons();
  btnDelTop.disabled = !n;
}
function refreshDraggables(){
  const drag = (currentTool === 'select');
  layerChildrenNoTransformer().forEach(n => n.draggable(drag));
}
function commitDragEnd(){
  transformer.moveToTop();
  commitHistory(); saveScene(); isDirty = false;
}
function enableSelect(node){
  if(node.__selectEnabled) return;
  node.__selectEnabled = true;
  node.on('pointerdown', () => { if(currentTool === 'select') selectNode(node); });
  node.on('dragmove transform', setDirty);
  node.on('dragend', commitDragEnd);
  node.on('transformend', commitDragEnd);
}

const snapToggle = document.getElementById('snapToggle');
let snapEnabled = snapToggle.checked;
snapToggle.addEventListener('change', () => snapEnabled = snapToggle.checked);
function nearestSnapPoint(p, thr){
  thr = thr || 16;
  if(!snapEnabled) return null;
  let best = null, bd = thr*thr;
  layerChildrenNoTransformer().forEach(s => {
    if(s === currentShape) return;
    if(s.className === 'Line' || s.className === 'Arrow'){
      const pts = s.points() || [];
      for(let i=0; i<pts.length; i+=2){
        const dx = p.x - pts[i], dy = p.y - pts[i+1];
        const d = dx*dx + dy*dy;
        if(d <= bd){ bd = d; best = { x:pts[i], y:pts[i+1] }; }
      }
    } else if(s.className === 'Group'){
      const gx = s.x(), gy = s.y();
      const dx = p.x - gx, dy = p.y - gy;
      const d = dx*dx + dy*dy;
      if(d <= bd){ bd = d; best = { x:gx, y:gy }; }
    }
  });
  return best;
}

function beginShape(pos){
  const t = LINE_TYPES[currentLineType];
  const dashed = t.dash || [];
  if(currentTool === 'line'){
    currentShape = new Konva.Line({
      points:[pos.x, pos.y, pos.x, pos.y],
      stroke:t.color, strokeWidth:t.width,
      dash:dashed,
      lineCap:'butt', lineJoin:'miter',
      hitStrokeWidth:20,
      perfectDrawEnabled:false,
      shadowForStrokeEnabled:false,
      listening:true,
    });
    drawLayer.add(currentShape);
    enableSelect(currentShape);
  } else if(currentTool === 'arrow'){
    currentShape = new Konva.Arrow({
      points:[pos.x, pos.y, pos.x, pos.y],
      stroke:t.color, fill:t.color, strokeWidth:t.width,
      dash:dashed,
      pointerLength:(t.pointerLen || 14),
      pointerWidth:(t.pointerLen || 14),
      pointerAtBeginning:false,
      lineCap:'butt', lineJoin:'miter',
      hitStrokeWidth:20,
      perfectDrawEnabled:false,
      shadowForStrokeEnabled:false,
      listening:true,
    });
    drawLayer.add(currentShape);
    enableSelect(currentShape);
  } else if(currentTool === 'text'){
    const t2 = new Konva.Text({
      x:pos.x, y:pos.y, text:'Tekst',
      fontSize:22, fill:TEXT_COLOR, fontStyle:'bold',
      draggable:true, padding:4, perfectDrawEnabled:false,
    });
    t2.on('dblclick dbltap', () => {
      const val = prompt('Wijzig tekst', t2.text());
      if(val !== null){ t2.text(val); commitHistory(); saveScene(); }
      drawLayer.batchDraw();
    });
    drawLayer.add(t2); enableSelect(t2); selectNode(t2);
    setTool('select');
    commitHistory(); saveScene();
  }
}
function updateShape(pos){
  if(!currentShape) return;
  if(currentShape.className === 'Line' || currentShape.className === 'Arrow'){
    const pts = currentShape.points();
    pts[2] = pos.x; pts[3] = pos.y;
    currentShape.points(pts);
  }
}
function finalizeShape(){
  if(!currentShape) return;
  if(currentShape.className === 'Line' || currentShape.className === 'Arrow'){
    const pts = currentShape.points();
    const dx = pts[2] - pts[0], dy = pts[3] - pts[1];
    if(dx*dx + dy*dy < 25){
      currentShape.destroy();
      currentShape = null;
      drawLayer.batchDraw();
      return;
    }
  }
  currentShape = null;
  commitHistory(); saveScene(); isDirty = false;
}

let rafPending = false, pendingPos = null;
function scheduleUpdate(){
  if(rafPending) return;
  rafPending = true;
  requestAnimationFrame(() => {
    rafPending = false;
    if(pendingPos && currentShape){ updateShape(pendingPos); drawLayer.batchDraw(); }
    pendingPos = null;
  });
}

function isDrawingTool(){
  return currentTool === 'line' || currentTool === 'arrow' || currentTool === 'text';
}

stage.on('pointerdown', e => {
  const evt = e.evt || {};
  const type = evt.pointerType || 'mouse';

  if(isPenOnly() && type === 'touch'){
    if(e.target === stage || e.target.getLayer() === bgLayer) selectNode(null);
    return;
  }

  if(pendingSymbol){
    const pos = stage.getPointerPosition();
    if(!pos) return;
    placeSymbol(pendingSymbol, pos.x, pos.y);
    return;
  }

  if(isDrawingTool()){
    if(e.target === stage || e.target.getLayer() === bgLayer) selectNode(null);
    let pos = stage.getPointerPosition();
    if(!pos) return;
    const s = nearestSnapPoint(pos, 18);
    if(s) pos = s;
    beginShape(pos);
    updateWrapperMode();
    return;
  }

  if(currentTool === 'select'){
    if(e.target === stage || e.target.getLayer() === bgLayer) selectNode(null);
  }
});

stage.on('pointermove', () => {
  if(!currentShape) return;
  let pos = stage.getPointerPosition();
  if(!pos) return;
  const s = nearestSnapPoint(pos, 18);
  if(s) pos = s;
  pendingPos = pos;
  scheduleUpdate();
});

function endPointer(){
  finalizeShape();
  updateWrapperMode();
}

function symbolSVG(def){
  const kind = def.kind;
  const color = def.color;
  const s = 30;

  if(kind === 'triangle'){
    return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 30 30"><polygon points="15,3 28,27 2,27" fill="'+color+'" stroke="#000" stroke-width="1.5"/></svg>';
  }
  if(kind === 'diamond'){
    return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 30 30"><polygon points="15,2 28,15 15,28 2,15" fill="'+color+'" stroke="#000" stroke-width="1.5"/></svg>';
  }
  if(kind === 'square'){
    return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 30 30"><rect x="3" y="3" width="24" height="24" fill="'+color+'" stroke="#000" stroke-width="1.5"/></svg>';
  }
  if(kind === 'circle'){
    return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 30 30"><circle cx="15" cy="15" r="10" fill="'+color+'" stroke="#000" stroke-width="1.5"/></svg>';
  }
  if(kind === 'label'){
    const rectW = 26, rectH = 15;
    const x = (s - rectW)/2, y = (s - rectH)/2;
    const fs = 12;
    return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 '+s+' '+s+'">'
      + '<rect x="'+x+'" y="'+y+'" width="'+rectW+'" height="'+rectH+'" fill="'+(def.bg||color)+'" stroke="#000" stroke-width="1.5"/>'
      + '<text x="15" y="'+(15 + fs*0.35)+'" text-anchor="middle" font-size="'+fs+'" font-weight="bold" fill="'+(def.fg||'#000')+'">'+(def.text||'?')+'</text>'
      + '</svg>';
  }
  if(kind === 'floor'){
    const label = def.shortLabel || def.label;
    const fs = label.length > 2 ? 10 : (label.length > 1 ? 12 : 14);
    return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 '+s+' '+s+'">'
      + '<text x="15" y="'+(15 + fs*0.35)+'" text-anchor="middle" font-size="'+fs+'" font-weight="800" fill="#8A6A00">'+label+'</text>'
      + '</svg>';
  }
  return '';
}

function makeSymbolShape(kind, color, def){
  def = def || {};
  if(kind === 'triangle') return new Konva.RegularPolygon({ sides:3, radius:22, fill:color, stroke:'#000', strokeWidth:1.5, perfectDrawEnabled:false });
  if(kind === 'diamond')  return new Konva.RegularPolygon({ sides:4, radius:22, fill:color, stroke:'#000', strokeWidth:1.5, perfectDrawEnabled:false });
  if(kind === 'square')   return new Konva.Rect({ x:-20, y:-20, width:40, height:40, fill:color, stroke:'#000', strokeWidth:1.5, perfectDrawEnabled:false });
  if(kind === 'circle')   return new Konva.Circle({ radius:10, fill:color, stroke:'#000', strokeWidth:1.5, perfectDrawEnabled:false });
  if(kind === 'label'){
    const w = def.w || 48, h = def.h || 30, fs = def.fs || 15;
    const g = new Konva.Group();
    g.add(new Konva.Rect({ x:-w/2, y:-h/2, width:w, height:h, fill:def.bg||color, stroke:'#000', strokeWidth:1.5, perfectDrawEnabled:false }));
    g.add(new Konva.Text({ x:-w/2, y:-h/2, width:w, height:h, text:def.text||'?', fontSize:fs, fontStyle:'bold', fill:def.fg||'#000', align:'center', verticalAlign:'middle', listening:false, perfectDrawEnabled:false }));
    return g;
  }
  return new Konva.Circle({ radius:10, fill:color });
}

function placeSymbol(keyOrDef, x, y){
  const def = (typeof keyOrDef === 'string') ? SYMBOLS[keyOrDef] : keyOrDef;
  if(!def) return;

  if(def.kind === 'textsym'){
    const t = new Konva.Text({
      x: x, y: y - 14,
      text: def.text || '?',
      fontSize: def.fs || 22,
      fill: def.color || '#FFC000',
      fontStyle: 'bold',
      draggable: false,
      padding: 4,
      perfectDrawEnabled: false,
    });
    t.on('dblclick dbltap', () => {
      const val = prompt('Wijzig tekst', t.text());
      if(val !== null){ t.text(val); commitHistory(); saveScene(); }
      drawLayer.batchDraw();
    });
    drawLayer.add(t);
    enableSelect(t);
    selectNode(t);
    drawLayer.batchDraw();
    commitHistory(); saveScene(); isDirty = false;
    setTool('select');
    document.querySelectorAll('.sym-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.yt-btn').forEach(b => b.classList.remove('active'));
    return;
  }

  if(def.kind === 'floor'){
    const label = def.shortLabel || def.label;
    const t = new Konva.Text({
      x: x - 30, y: y - 18,
      width: 60, height: 36,
      text: label,
      fontSize: 22, fill: '#FFC000', fontStyle: 'bold',
      align: 'center', verticalAlign: 'middle',
      draggable: false, perfectDrawEnabled: false,
      listening: true,
    });
    t.on('dblclick dbltap', () => {
      const val = prompt('Wijzig verdieping', t.text());
      if(val !== null){ t.text(val); commitHistory(); saveScene(); }
      drawLayer.batchDraw();
    });
    drawLayer.add(t);
    enableSelect(t);
    selectNode(t);
    drawLayer.batchDraw();
    commitHistory(); saveScene(); isDirty = false;
    setTool('select');
    document.querySelectorAll('.sym-btn').forEach(b => b.classList.remove('active'));
    return;
  }

  const g = new Konva.Group({ x:x, y:y, draggable:false });
  g.add(makeSymbolShape(def.kind, def.color, def));
  drawLayer.add(g);
  enableSelect(g);
  selectNode(g);
  drawLayer.batchDraw();
  commitHistory(); saveScene(); isDirty = false;
  setTool('select');
  document.querySelectorAll('.sym-btn').forEach(b => b.classList.remove('active'));
}

const fileInput = document.getElementById('file-input');

  const files = [...(e.target.files||[])];
  await handleFiles(files);
  e.target.value = '';
});

function newId(){ return 'img-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2,8); }

async function handleFiles(files){
  if(!files || !files.length) return;
  files.sort((a, b) => (a.name || '').localeCompare(b.name || '', undefined, { numeric: true, sensitivity: 'base' }));

  const items = await Promise.all(files.map(f => new Promise(res => {
    const fr = new FileReader();
    fr.onload = () => {
      const im = new Image();
      im.onload = () => res({ id:newId(), name:f.name, dataURL:fr.result, w:im.naturalWidth, h:im.naturalHeight });
      im.onerror = () => res(null);
      im.src = fr.result;
    };
    fr.onerror = () => res(null);
    fr.readAsDataURL(f);
  })));
  const good = items.filter(Boolean);
  if(!good.length) return;

  const had = imageFiles.length > 0;
  if(!had){
    if(layerChildrenNoTransformer().length) clearLayer();
    imageFiles = good;
    currentIndex = 0; currentId = good[0].id;
    good.forEach(it => { scenes[it.id] = EMPTY_JSON; history[it.id] = { past:[EMPTY_JSON], future:[] }; });
  } else {
    selectNode(null); flushAndSave();
    imageFiles = imageFiles.concat(good);
    imageFiles.sort((a, b) => (a.name || '').localeCompare(b.name || '', undefined, { numeric: true, sensitivity: 'base' }));
    good.forEach(it => { scenes[it.id] = EMPTY_JSON; history[it.id] = { past:[EMPTY_JSON], future:[] }; });
    currentIndex = imageFiles.findIndex(f => f.id === currentId);
    if(currentIndex < 0) currentIndex = 0;
  }
  renderThumbs();
  loadImageAt(currentIndex);
}

function renderThumbs(){
  thumbsEl.innerHTML = '';
  imageFiles.forEach((f, i) => {
    const b = document.createElement('button');
    b.className = 'thumb-btn' + (i === currentIndex ? ' active' : '');
    b.textContent = String(i+1);
    b.title = f.name;
    b.addEventListener('click', () => {
      if(currentIndex >= 0){ selectNode(null); flushAndSave(); }
      currentIndex = i; currentId = f.id;
      loadImageAt(i); renderThumbs();
    });
    thumbsEl.appendChild(b);
  });
  updateBottomBar();
}

function updateBottomBar(){
  const info = document.getElementById('bb-info');

  const next = document.getElementById('bb-next');

    prev.disabled = true; next.disabled = true;

  }
}

function fitImageToStage(meta){
  if(!meta){ bgImageNode.image(null); bgLayer.batchDraw(); resizeStage(STAGE_W, STAGE_H); return; }
  const img = new Image();
  img.onload = () => {
    sizeToWrapper();
    const scaleX = STAGE_W / meta.w;
    const scaleY = STAGE_H / meta.h;
    const scale = Math.min(scaleX, scaleY);
    const iw = meta.w * scale;
    const ih = meta.h * scale;
    const sw = Math.max(STAGE_W, Math.ceil(iw));
    const sh = Math.max(STAGE_H, Math.ceil(ih));
    resizeStage(sw, sh);
    const ix = Math.max(0, (sw - iw) / 2);
    const iy = Math.max(0, (sh - ih) / 2);
    bgImageNode.setAttrs({ image:img, x:ix, y:iy, width:iw, height:ih });
    bgLayer.batchDraw();
    centerViewportOnBg();
  };
  img.src = meta.dataURL;
}
function centerViewportOnBg(){
  const wrap = document.getElementById('canvas-wrapper');
  const cx = bgImageNode.x() + bgImageNode.width()/2;
  const cy = bgImageNode.y() + bgImageNode.height()/2;
  wrap.scrollLeft = Math.max(0, cx - wrap.clientWidth/2);
  wrap.scrollTop = Math.max(0, cy - wrap.clientHeight/2);
}

function loadImageAt(i){
  if(i < 0 || !imageFiles[i]) return;
  const meta = imageFiles[i];
  currentId = meta.id;
  fitImageToStage(meta);
  curName.textContent = meta.name || '–';
  applyJSON(scenes[currentId] || EMPTY_JSON);
  updateUndoRedo();
  renderThumbs();
}

function switchImage(d){
  if(!imageFiles.length) return;
  if(currentIndex >= 0){ selectNode(null); flushAndSave(); }
  currentIndex = (currentIndex + d + imageFiles.length) % imageFiles.length;
  currentId = imageFiles[currentIndex].id;
  loadImageAt(currentIndex);
}
document.getElementById('btn-prev').addEventListener('click', () => switchImage(-1));
document.getElementById('btn-next').addEventListener('click', () => switchImage(1));

document.getElementById('btn-remove-photo').addEventListener('click', () => {
  if(currentIndex < 0) return;
  const removed = imageFiles.splice(currentIndex, 1)[0];
  if(removed){ delete scenes[removed.id]; delete history[removed.id]; }
  if(!imageFiles.length){
    currentIndex = -1; currentId = null;
    fitImageToStage(null); clearLayer();
    curName.textContent = '–'; thumbsEl.innerHTML = '';
    updateUndoRedo(); updateBottomBar();
    return;
  }
  if(currentIndex >= imageFiles.length) currentIndex = imageFiles.length-1;
  currentId = imageFiles[currentIndex].id;
  loadImageAt(currentIndex);
});

document.getElementById('btn-clear-queue').addEventListener('click', () => {

let lastCommitJson = '';
let lastCommitTime = 0;

function snapshot(){
  const children = layerChildrenNoTransformer();
  const arr = [];
  for(let i = 0; i < children.length; i++){
    try{ arr.push(children[i].toJSON()); }catch(e){}
  }
  return JSON.stringify(arr);
}

function applyJSON(jsonStr){
  clearLayer();
  if(jsonStr){
    try{
      let arr = [];
      const parsed = JSON.parse(jsonStr);
      if(Array.isArray(parsed)){
        arr = parsed;
      } else if(parsed && parsed.className === 'Layer' && Array.isArray(parsed.children)){
        arr = parsed.children;
      }
      for(let i = 0; i < arr.length; i++){
        try{
          const node = Konva.Node.create(arr[i]);
          if(node){
            drawLayer.add(node);
            enableSelect(node);
          }
        }catch(e){ logErr('Node', String(e && e.message || e)); }
      }
    }catch(e){ logErr('JSON', String(e && e.message || e)); }
  }
  drawLayer.add(transformer);
  drawLayer.batchDraw();
  selectNode(null);
  refreshDraggables();
  lastCommitJson = '';
  lastCommitTime = 0;
}

function clearLayer(){
  const layer = transformer.getLayer();
  transformer.remove();
  drawLayer.destroyChildren();
  layer.add(transformer);
  drawLayer.batchDraw();
}
function saveScene(){ if(currentId) scenes[currentId] = snapshot(); }
function flushAndSave(){ if(isDirty){ commitHistory(); saveScene(); isDirty = false; } }

function commitHistory(){
  if(!currentId) return;
  if(!history[currentId]) history[currentId] = { past:[EMPTY_JSON], future:[] };
  const json = snapshot();
  const h = history[currentId];
  const last = h.past[h.past.length-1];
  if(last === json) return;
  const now = Date.now();
  if(json === lastCommitJson && now - lastCommitTime < 300) return;
  h.past.push(json);
  if(h.past.length > 80) h.past.shift();
  h.future = [];
  scenes[currentId] = json;
  lastCommitJson = json;
  lastCommitTime = now;
  updateUndoRedo();
}
function undo(){
  if(!currentId) return;
  const h = history[currentId];
  if(!h || h.past.length <= 1) return;
  const cur = h.past.pop();
  h.future.push(cur);
  const prev = h.past[h.past.length-1];
  applyJSON(prev);
  scenes[currentId] = prev;
  updateUndoRedo();
}
function redo(){
  if(!currentId) return;
  const h = history[currentId];
  if(!h || !h.future.length) return;
  const next = h.future.pop();
  h.past.push(next);
  applyJSON(next);
  scenes[currentId] = next;
  updateUndoRedo();
}
function updateUndoRedo(){
  const h = history[currentId];
  const bu = document.getElementById('btn-undo');
  const br = document.getElementById('btn-redo');
  if(bu) bu.disabled = !(h && h.past.length > 1);
  if(br) br.disabled = !(h && h.future.length > 0);
}

function dataURLToBlob(dataURL){
  const commaIndex = dataURL.indexOf(',');
  if(commaIndex === -1) throw new Error('Invalid dataURL');
  const base64 = dataURL.substring(commaIndex+1);
  const byteString = atob(base64);
  const arr = new Uint8Array(byteString.length);
  for(let i=0; i<byteString.length; i++) arr[i] = byteString.charCodeAt(i);
  const mime = (dataURL.substring(0, commaIndex).match(/:(.*?);/) || [])[1] || 'image/jpeg';
  return new Blob([arr], { type:mime });
}
async function compressToJpeg(dataURL, maxKB){
  maxKB = maxKB || 500;
  const img = new Image();
  img.src = dataURL;
  await new Promise((res, rej) => { img.onload = res; img.onerror = rej; });
  const canvas = document.createElement('canvas');
  canvas.width = img.width; canvas.height = img.height;
  canvas.getContext('2d').drawImage(img, 0, 0);
  let quality = 0.85;
  const maxBytes = maxKB*1024;
  let blob;
  do {
    blob = dataURLToBlob(canvas.toDataURL('image/jpeg', quality));
    if(blob.size <= maxBytes || quality <= 0.4) break;
    quality -= 0.05;
  } while(quality > 0.4);
  return blob;
}
async function exportCroppedURL(){
  for(let i=0; i<40; i++){
    try{
      const im = bgImageNode.image && bgImageNode.image();
      if(im && im.complete && im.naturalWidth > 0) break;
    }catch(_){}
    await new Promise(r => setTimeout(r, 30));
  }
  const rect = bgImageNode.getClientRect({ skipShadow:true, skipStroke:true });
  if(!rect || !rect.width || !rect.height){
    return stage.toDataURL({ mimeType:'image/png', pixelRatio:2 });
  }
  const im = bgImageNode.image && bgImageNode.image();
  const pr = (im && rect.width) ? (im.naturalWidth / rect.width) : 2;
  const prev = transformer.nodes();
  transformer.visible(false); transformer.nodes([]);
  drawLayer.draw();
  await new Promise(r => setTimeout(r, 20));
  const url = stage.toDataURL({
    mimeType:'image/png', x:rect.x, y:rect.y, width:rect.width, height:rect.height,
    pixelRatio:Math.max(2, pr),
  });
  transformer.visible(true); transformer.nodes(prev);
  drawLayer.batchDraw();
  return url;
}
function downloadBlob(name, blob){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 800);
}
document.getElementById('btn-export').addEventListener('click', async () => {
  try{
    if(currentIndex < 0){ logErr('Export', 'Geen foto geladen'); return; }
    const url = await exportCroppedURL();

    const base = (imageFiles[currentIndex] && imageFiles[currentIndex].name)
      ? imageFiles[currentIndex].name.replace(/\.[^.]+$/,'') : 'tekening';
    downloadBlob(base + '-annotated.jpg', blob);
  }catch(e){ logErr('Export', String(e && e.message || e)); }
});

function SimpleZip(){ this.parts=[]; this.files=[]; this.size=0; }
function CRC32(){ if(!CRC32.table){ CRC32.table = new Uint32Array(256); for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1); CRC32.table[n]=c>>>0; } } this.crc = ~0; }
CRC32.prototype.update = function(arr){ const t = CRC32.table; let c = this.crc; for(let i=0;i<arr.length;i++) c = t[(c^arr[i])&255]^(c>>>8); this.crc = c; };
CRC32.prototype.digest = function(){ return (~this.crc)>>>0; };
function le16(v){ return new Uint8Array([v&255,(v>>>8)&255]); }
function le32(v){ return new Uint8Array([v&255,(v>>>8)&255,(v>>>16)&255,(v>>>24)&255]); }
function dosTime(dt){ dt = dt||new Date(); return { time:(dt.getHours()<<11)|(dt.getMinutes()<<5)|(Math.floor(dt.getSeconds()/2)), date:((dt.getFullYear()-1980)<<9)|((dt.getMonth()+1)<<5)|dt.getDate() }; }
SimpleZip.prototype.add = function(name, bytes, mtime){
  if(!(bytes instanceof Uint8Array)) bytes = new Uint8Array(bytes);
  const enc = new TextEncoder(); const nb = enc.encode(name); const ts = dosTime(mtime);
  const c = new CRC32(); c.update(bytes); const crc = c.digest()>>>0;
  const local = [le32(0x04034b50), le16(20), le16(0), le16(0), le16(ts.time), le16(ts.date), le32(crc), le32(bytes.length), le32(bytes.length), le16(nb.length), le16(0), nb];
  let L=0; for(const p of local) L+=p.length;
  const lh = new Uint8Array(L); let o=0; for(const p of local){ lh.set(p,o); o+=p.length; }
  this.parts.push(lh, bytes);
  const off = this.size; this.size += lh.length + bytes.length;
  this.files.push({ nb, ts, crc, size:bytes.length, off });
};
SimpleZip.prototype.render = function(){
  const central = []; let centralSize = 0;
  for(const f of this.files){
    const cd = [le32(0x02014b50), le16(20), le16(20), le16(0), le16(0), le16(f.ts.time), le16(f.ts.date), le32(f.crc), le32(f.size), le32(f.size), le16(f.nb.length), le16(0), le16(0), le16(0), le16(0), le32(0), le32(f.off), f.nb];
    let L=0; for(const p of cd) L+=p.length;
    const buf = new Uint8Array(L); let o=0; for(const p of cd){ buf.set(p,o); o+=p.length; }
    central.push(buf); centralSize += L;
  }
  const eocd = new Uint8Array(22); let o=0;
  eocd.set(le32(0x06054b50), o); o+=4;
  eocd.set(le16(0), o); o+=2; eocd.set(le16(0), o); o+=2;
  eocd.set(le16(this.files.length), o); o+=2; eocd.set(le16(this.files.length), o); o+=2;
  eocd.set(le32(centralSize), o); o+=4; eocd.set(le32(this.size), o); o+=4;
  eocd.set(le16(0), o); o+=2;
  const all = [...this.parts, ...central, eocd];
  let sum=0; for(const p of all) sum+=p.length;
  const out = new Uint8Array(sum); let pos=0;
  for(const p of all){ out.set(p,pos); pos+=p.length; }
  return new Blob([out], { type:'application/zip' });
};

async function saveBlobToDir(dirHandle, filename, blob){
  const fh = await dirHandle.getFileHandle(filename, { create:true });
  const w = await fh.createWritable();
  await w.write(blob);
  await w.close();
}

document.getElementById('btn-export-all').addEventListener('click', async () => {
  if(!imageFiles.length) return;

  let dirHandle = null;
  const canPickDir = !!window.showDirectoryPicker;
  if(canPickDir){
    try{
      dirHandle = await window.showDirectoryPicker({ id:'fiber-export', mode:'readwrite' });
    }catch(e){
      if(e && e.name === 'AbortError') return;
      dirHandle = null;
      logErr('Map', 'Kon geen map openen, val terug op ZIP');
    }
  }

  const prevIndex = currentIndex;
  const includeJson = document.getElementById('includeProjectJson').checked;
  const outFiles = [];

  for(let i=0; i<imageFiles.length; i++){
    if(currentIndex !== i){
      if(currentIndex >= 0){ selectNode(null); flushAndSave(); }
      currentIndex = i; currentId = imageFiles[i].id;
      loadImageAt(i);
    }
    await new Promise(r => setTimeout(r, 80));
    try{
      const url = await exportCroppedURL();
      const blob = await compressToJpeg(url, 500);
      const base = (imageFiles[i].name || ('beeld-'+(i+1))).replace(/\.[^.]+$/,'');
      outFiles.push({ name: base + '.jpg', blob: blob });
    }catch(e){ logErr('Export '+i, String(e && e.message || e)); }
  }

  let jsonBlob = null, jsonName = null;
  if(includeJson){
    flushAndSave();
    const imgs = imageFiles.map(it => ({ id:it.id, name:it.name, dataURL:it.dataURL, w:it.w, h:it.h }));
    const sc = {}; imgs.forEach(it => { sc[it.id] = scenes[it.id] || EMPTY_JSON; });
    const data = { version:5, projectName:(document.getElementById('projectName').value||'').trim(), images:imgs, scenes:sc };
    jsonBlob = new Blob([JSON.stringify(data)], { type:'application/json' });
    jsonName = 'project.json';
  }

  if(dirHandle){
    try{
      for(const f of outFiles){
        await saveBlobToDir(dirHandle, f.name, f.blob);
      }
      if(jsonBlob && jsonName){
        await saveBlobToDir(dirHandle, jsonName, jsonBlob);
      }
      logErr('OK', outFiles.length + ' bestand(en) opgeslagen in gekozen map');
    }catch(e){
      logErr('Map opslaan', String(e && e.message || e));
      const zip = new SimpleZip();
      for(const f of outFiles){
        zip.add(f.name, new Uint8Array(await f.blob.arrayBuffer()), new Date());
      }
      if(jsonBlob && jsonName){
        zip.add(jsonName, new Uint8Array(await jsonBlob.arrayBuffer()), new Date());
      }
      downloadBlob('export.zip', zip.render());
    }
  } else {
    const zip = new SimpleZip();
    for(const f of outFiles){
      zip.add(f.name, new Uint8Array(await f.blob.arrayBuffer()), new Date());
    }
    if(jsonBlob && jsonName){
      zip.add(jsonName, new Uint8Array(await jsonBlob.arrayBuffer()), new Date());
    }
    downloadBlob('export.zip', zip.render());
    logErr('OK', 'ZIP met ' + outFiles.length + ' bestand(en) gedownload');
  }

  if(prevIndex >= 0) loadImageAt(prevIndex);
});
