<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Tekenapp — Apple Pencil</title>
<style>
:root{
  --brand:#C00000; --brand-dark:#8A0000;
  --bg:#f1f3f5; --panel:#ffffff; --line:#e2e5ea;
  --text:#1c2024; --accent:#0B4EA2;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:var(--bg);color:var(--text);
  display:flex;flex-direction:column;height:100dvh;
}
button,.btn,.chip,.sym,.thumb-btn{touch-action:manipulation;user-select:none;-webkit-user-select:none}

/* Toolbar */
.toolbar{
  flex:0 0 auto;display:flex;align-items:center;gap:6px;
  padding:6px 8px;padding-top:calc(6px + env(safe-area-inset-top));
  background:#fff;border-bottom:1px solid var(--line);
  overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;white-space:nowrap;
}
.toolbar::-webkit-scrollbar{height:0}
.btn{
  border:none;background:var(--brand);color:#fff;border-radius:8px;
  padding:9px 13px;font-size:14px;font-weight:600;cursor:pointer;
  min-height:40px;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;
  white-space:nowrap;
}
.btn:active{background:var(--brand-dark)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.active{background:#fff;color:var(--brand-dark);border:2px solid var(--brand-dark);padding:7px 11px}
.icon-btn{
  width:40px;height:40px;padding:0;border:1px solid var(--line);background:#fff;color:#333;
  border-radius:8px;font-size:18px;cursor:pointer;flex-shrink:0;
}
.icon-btn:active{background:#f1f3f5}
.chip{
  border:2px solid transparent;border-radius:6px;padding:7px 11px;
  font-size:13px;font-weight:700;cursor:pointer;min-height:36px;flex-shrink:0;
}
.chip.active{box-shadow:0 0 0 2px var(--accent)}
.divider{width:1px;height:26px;background:var(--line);margin:0 2px;flex-shrink:0}

/* Layout */
#container{flex:1;min-height:0;display:grid;grid-template-columns:1fr;position:relative}
#canvas-wrapper{
  overflow:auto;background:#e9ecef;position:relative;
  -webkit-overflow-scrolling:touch;
  touch-action:pan-x pan-y;
  user-select:none;-webkit-user-select:none;
}
#canvas-wrapper.drawing{touch-action:none}
#stage{user-select:none;-webkit-user-select:none}

.panel{background:var(--panel);display:flex;flex-direction:column;overflow:hidden}
.panel-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 12px;border-bottom:1px solid var(--line);
  font-weight:700;flex-shrink:0;
}
.close-x{border:none;background:transparent;font-size:20px;cursor:pointer;width:38px;height:38px;border-radius:8px}
.close-x:active{background:#f1f3f5}
.panel .content{padding:12px;overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch}

@media (max-width:1099px){
  .panel{
    position:fixed;top:0;bottom:0;width:min(88vw,340px);z-index:2000;
    transition:transform .25s ease;box-shadow:0 8px 32px rgba(0,0,0,.25);
    padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);
  }
  .panel-left{left:0;transform:translateX(-105%)}
  .panel-right{right:0;transform:translateX(105%)}
  body.drawer-left .panel-left{transform:translateX(0)}
  body.drawer-right .panel-right{transform:translateX(0)}
  #backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1500;display:none}
  body.drawer-left #backdrop,body.drawer-right #backdrop{display:block}
}
@media (min-width:1100px){
  #container{grid-template-columns:300px 1fr 320px;gap:10px;padding:10px}
  .close-x,#toggle-left,#toggle-right,#backdrop{display:none}
  .panel{border:1px solid var(--line);border-radius:12px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
  #canvas-wrapper{border:1px solid var(--line);border-radius:12px;background:#fff}
  .panel-head{display:none}
  .panel .content{padding:14px}
}

/* Form */
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.row:last-child{margin-bottom:0}
.row strong{font-size:14px}
.small{font-size:12px;color:#6b7280}
hr.sep{margin:14px 0;border:none;border-top:1px solid var(--line)}
label.check{display:flex;align-items:center;gap:8px;font-size:14px;min-height:34px}
input[type=number]{width:64px;padding:8px 9px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:#fff}
input[type=text]{padding:9px 10px;border:1px solid var(--line);border-radius:8px;font-size:14px;width:100%;background:#fff}
input[type=color]{width:42px;height:38px;padding:0;border:1px solid var(--line);border-radius:8px;background:#fff}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--brand)}
.hidden{display:none!important}
.pen-indicator{
  display:inline-flex;align-items:center;gap:6px;padding:6px 10px;
  border-radius:20px;background:#f1f3f5;font-size:12px;font-weight:600;
  color:#666;flex-shrink:0;
}
.pen-indicator.active{background:#4EA72E;color:#fff}
.pen-dot{width:8px;height:8px;border-radius:50%;background:currentColor}

/* Symbols */
.symbols-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:6px;margin-top:6px}
.sym{
  border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px;
  cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:68px;
}
.sym:active{background:#f1f3f5}
.sym .icon{
  display:flex;align-items:center;justify-content:center;
  width:100%;height:34px;border:1.5px solid #000;border-radius:4px;
  font-weight:800;font-size:12px;
}
.sym .circle-ic{
  width:28px;height:28px;border-radius:50%;border:3px solid currentColor;
  background:transparent;display:inline-block;margin:3px 0;
}
.sym .lbl{font-size:10px;color:#555;text-align:center;line-height:1.1}

/* Thumbs */
.thumbs{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;max-height:130px;overflow-y:auto}
.thumb-btn{
  padding:7px 11px;border:1px solid var(--line);border-radius:6px;background:#fff;
  cursor:pointer;font-weight:600;font-size:13px;min-width:38px;min-height:36px;
}
.thumb-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}

/* Error console */
#mini-error-console{
  position:fixed;right:8px;bottom:8px;max-width:min(42ch,80vw);max-height:30vh;overflow:auto;
  font:11px/1.35 ui-monospace,Menlo,monospace;background:#111;color:#f66;
  padding:8px 10px;border-radius:10px;z-index:999999;white-space:pre-wrap;
  pointer-events:none;opacity:0;transition:opacity .3s;box-shadow:0 6px 18px rgba(0,0,0,.35);
}
#mini-error-console.show{opacity:1}
#mini-error-console b{color:#fff}
#mini-error-console .ok{color:#8f8}
</style>
</head>
<body>

<div class="toolbar">
  <button id="toggle-left" class="icon-btn" title="Foto's & symbolen">☰</button>
  <button id="tool-select" class="btn active">Select</button>
  <button id="tool-line"   class="btn">Lijn</button>
  <button id="tool-arrow"  class="btn">Pijl</button>
  <button id="tool-rect"   class="btn">Vak</button>
  <button id="tool-text"   class="btn">Tekst</button>
  <div class="divider"></div>
  <button class="chip" data-color="green">●</button>
  <button class="chip" data-color="yellow">●</button>
  <button class="chip" data-color="red">●</button>
  <button class="chip" data-color="blue">●</button>
  <button class="chip" data-color="orange">●</button>
  <button class="chip" data-color="purple">●</button>
  <button class="chip" data-color="black">●</button>
  <button class="chip" data-color="gray">●</button>
  <button class="chip" data-color="white">●</button>
  <input type="color" id="customColor" title="Eigen kleur" />
  <div class="divider"></div>
  <button id="btn-undo" class="btn" disabled>Undo</button>
  <button id="btn-redo" class="btn" disabled>Redo</button>
  <span class="pen-indicator" id="penIndicator"><span class="pen-dot"></span>Pen: wacht</span>
  <button id="toggle-right" class="icon-btn" title="Acties">⚙</button>
</div>

<div id="container">
  <aside id="panel-left" class="panel panel-left">
    <div class="panel-head"><span>Foto's & symbolen</span><button class="close-x" data-close="left">✕</button></div>
    <div class="content">
      <div class="row"><strong>Bulk foto's</strong></div>
      <div class="row">
        <button id="btn-load" class="btn">Bestanden kiezen…</button>
        <input id="file-input" class="hidden" type="file" accept="image/*" multiple>
      </div>
      <div class="row">
        <button id="btn-prev" class="btn">← Vorige</button>
        <button id="btn-next" class="btn">Volgende →</button>
      </div>
      <div id="thumbs" class="thumbs"></div>

      <hr class="sep">
      <div class="row"><strong>✍️ Apple Pencil</strong></div>
      <label class="check"><input type="checkbox" id="penOnlyToggle" checked> Alleen pen (palm rejection)</label>
      <label class="check"><input type="checkbox" id="pressureToggle" checked> Drukgevoeligheid</label>
      <div class="small" style="margin-top:4px">De pen-status staat ook in de werkbalk.</div>

      <hr class="sep">
      <div class="row"><strong>Symbolen</strong></div>
      <div class="symbols-grid" id="symbols-grid"></div>

      <hr class="sep">
      <div class="row"><strong>Lijndikte</strong></div>
      <div class="row">
        <input type="number" id="strokeWidth" value="3" min="1" max="50" />
        <span class="small">px (basis)</span>
      </div>

      <hr class="sep">
      <div class="row"><strong>Opties</strong></div>
      <label class="check"><input type="checkbox" id="dashToggle"> Stippellijn</label>
      <label class="check"><input type="checkbox" id="snapToggle" checked> Snap to line</label>
      <label class="check"><input type="checkbox" id="doubleArrowToggle"> Dubbele pijl</label>
      <label class="check"><input type="checkbox" id="rectFillToggle"> Vak met witte vulling</label>
    </div>
  </aside>

  <main id="canvas-wrapper"><div id="stage"></div></main>

  <aside id="panel-right" class="panel panel-right">
    <div class="panel-head"><span>Acties</span><button class="close-x" data-close="right">✕</button></div>
    <div class="content">
      <div class="row"><strong>Huidig beeld</strong></div>
      <div class="small" id="current-name" style="word-break:break-all">–</div>
      <hr class="sep">
      <div class="row">
        <button id="btn-rename-photo" class="btn">Hernoem foto</button>
      </div>
      <div class="row">
        <button id="btn-remove-photo" class="btn">Verwijder foto</button>
        <button id="btn-clear-queue" class="btn">Verwijder alles</button>
      </div>
      <hr class="sep">
      <div class="row"><strong>Lagen</strong></div>
      <div class="row">
        <button id="btn-up" class="btn" disabled>Omhoog</button>
        <button id="btn-down" class="btn" disabled>Omlaag</button>
        <button id="btn-clear" class="btn">Wissen</button>
      </div>
      <hr class="sep">
      <div class="row"><strong>Exporteren</strong></div>
      <div class="row">
        <button id="btn-export" class="btn">Export JPEG</button>
        <button id="btn-export-all" class="btn">Exporteer alles</button>
      </div>
      <label class="check"><input type="checkbox" id="includeProjectJson"> Project.json meesturen</label>
      <hr class="sep">
      <div class="row"><strong>Project</strong></div>
      <div class="row">
        <label class="small" for="projectName" style="min-width:90px">Naam:</label>
        <input id="projectName" type="text" placeholder="bv. Wyre_MRO_Zone1" />
      </div>
      <div class="row">
        <button id="btn-export-project" class="btn">Opslaan (JSON)</button>
        <button id="btn-load-project" class="btn">Laden (JSON)</button>
        <input id="project-input" class="hidden" type="file" accept="application/json">
      </div>
    </div>
  </aside>
</div>

<div id="backdrop"></div>
<div id="mini-error-console" aria-live="polite">OK: console actief</div>

<script src="https://unpkg.com/konva@9/konva.min.js"></script>
<script>window.Konva||document.write('<script src="https://cdn.jsdelivr.net/npm/konva@9/konva.min.js"><\/script>');</script>
<script>window.Konva||document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/konva/9.3.16/konva.min.js"><\/script>');</script>

<script>
(function(){
'use strict';

/* ============ Error console ============ */
const errBox = document.getElementById('mini-error-console');
let errTimer = null;
function logErr(kind, msg){
  if(!errBox) return;
  const d = document.createElement('div');
  d.innerHTML = '<b>'+kind+':</b> '+String(msg||'');
  errBox.appendChild(d);
  errBox.classList.add('show');
  clearTimeout(errTimer);
  errTimer = setTimeout(()=>errBox.classList.remove('show'), 6000);
}
window.addEventListener('error', e => logErr('Error', (e.message||'')+' @ '+(e.filename||'').split('/').pop()+':'+(e.lineno||'')));
window.addEventListener('unhandledrejection', e => logErr('Promise', String(e.reason||'unknown')));

if(typeof Konva === 'undefined'){
  document.body.innerHTML =
    '<div style="padding:40px;font-family:-apple-system,sans-serif;max-width:600px;margin:auto">' +
    '<h1>Konva kon niet laden</h1>' +
    '<p>De tekenbibliotheek kon niet worden gedownload. Controleer je internet en herlaad in Safari/Chrome.</p></div>';
  return;
}

/* ============ Pen state ============ */
const penState = {
  active:false,        // is er nu een pen-actieve aanraking?
  lastPressure:0,
  lastType:'touch',
};
const penIndicator = document.getElementById('penIndicator');
function setPenIndicator(text, active){
  if(!penIndicator) return;
  penIndicator.innerHTML = '<span class="pen-dot"></span>' + text;
  penIndicator.classList.toggle('active', !!active);
}

/* ============ Symbols & colors ============ */
const SYMBOLS = {
  BUDI:{label:'B',bg:'#4EA72E',fg:'#000',w:80,h:50,fs:26},
  FLOORBOX:{label:'FB',bg:'#FFFFFF',fg:'#000',w:80,h:50,fs:20},
  POC:{label:'P',bg:'#FFD400',fg:'#000',w:80,h:50,fs:24},
  INTRO:{label:'Intro',bg:'#E00000',fg:'#000',w:80,h:50,fs:16},
  UNIT:{label:'UNIT',bg:'#111111',fg:'#fff',w:80,h:50,fs:16},
  EXIT:{label:'EXIT',bg:'#4EA72E',fg:'#fff',w:80,h:50,fs:16},
  BL:{label:'BL',bg:'#E00000',fg:'#fff',w:60,h:50,fs:20},
  AED:{label:'AED',bg:'#4EA72E',fg:'#fff',w:60,h:50,fs:15},
  RM:{label:'RM',bg:'#FF8C00',fg:'#000',w:60,h:50,fs:20},
  BS:{label:'BS',bg:'#E00000',fg:'#fff',w:60,h:50,fs:20},
  NV:{label:'NV',bg:'#4EA72E',fg:'#fff',w:60,h:50,fs:20},
  BM:{label:'BM',bg:'#E00000',fg:'#fff',w:60,h:50,fs:20},
  ND:{label:'ND',bg:'#4EA72E',fg:'#fff',w:60,h:50,fs:20},
  TH:{label:'TH',bg:'#1E6FD9',fg:'#fff',w:60,h:50,fs:20},
  EHBO:{label:'EHBO',bg:'#4EA72E',fg:'#fff',w:60,h:50,fs:13},
  SL:{label:'SL',bg:'#FFD400',fg:'#000',w:60,h:50,fs:20},
  V_DOORB:{shape:'circle',stroke:'#4EA72E'},
  H_DOORB:{shape:'circle',stroke:'#FFD400'},
  R_DOORB:{shape:'circle',stroke:'#E00000'},
  B_DOORB:{shape:'circle',stroke:'#1E6FD9'},
};
const SYM_LABELS = {
  BUDI:'Budi',FLOORBOX:'Floor',POC:'POC',INTRO:'Intro',UNIT:'Unit',
  EXIT:'Exit',BL:'Brandblusser',AED:'AED',RM:'Rookmelder',BS:'Brandslang',
  NV:'Noodverl.',BM:'Brandmelder',ND:'Nooddeur',TH:'Trappenhuis',
  EHBO:'EHBO',SL:'Sluitpost',
  V_DOORB:'Deur groen',H_DOORB:'Deur geel',R_DOORB:'Deur rood',B_DOORB:'Deur blauw',
};
const COLORS = {
  green:'#4EA72E',yellow:'#FFD400',red:'#E00000',
  blue:'#1E6FD9',orange:'#FF8C00',purple:'#8B5CF6',
  black:'#000000',gray:'#666666',white:'#FFFFFF',
};

(function buildSymbols(){
  const grid = document.getElementById('symbols-grid');
  Object.keys(SYMBOLS).forEach(key => {
    const def = SYMBOLS[key];
    const b = document.createElement('button');
    b.className = 'sym';
    b.dataset.sym = key;
    let inner = '';
    if(def.shape === 'circle'){
      inner = '<span class="circle-ic" style="color:'+def.stroke+'"></span>';
    } else {
      const fg = def.fg || '#000';
      inner = '<span class="icon" style="background:'+def.bg+';color:'+fg+'">'+def.label+'</span>';
    }
    b.innerHTML = inner + '<span class="lbl">'+(SYM_LABELS[key]||key)+'</span>';
    b.addEventListener('click', () => addSymbol(key));
    grid.appendChild(b);
  });
})();

const chipEls = document.querySelectorAll('.chip[data-color]');
chipEls.forEach(ch => {
  const c = COLORS[ch.dataset.color];
  ch.style.background = ch.dataset.color === 'white' ? '#fff' : c;
  ch.style.color = (ch.dataset.color === 'white' || ch.dataset.color === 'yellow') ? '#111' : '#fff';
});

/* ============ State ============ */
let imageFiles = [];
let currentIndex = -1;
let currentId = null;
const scenes = {};
const history = {};
let isDirty = false;
function setDirty(){ isDirty = true; }
function flushAndSave(){ if(isDirty){ commitHistory(); saveScene(); isDirty = false; } }
const EMPTY_JSON = '{"className":"Layer","attrs":{},"children":[]}';

/* ============ Stage ============ */
let STAGE_W = 800, STAGE_H = 600;
const stage = new Konva.Stage({
  container:'stage', width:STAGE_W, height:STAGE_H,
});
const bgLayer = new Konva.Layer({ listening:false });
const drawLayer = new Konva.Layer({ listening:true });
stage.add(bgLayer); stage.add(drawLayer);
const bgImageNode = new Konva.Image({ listening:false, draggable:false, perfectDrawEnabled:false });
bgLayer.add(bgImageNode);

const transformer = new Konva.Transformer({
  rotateEnabled:true,
  rotationSnaps:[0,45,90,135,180,225,270,315],
  enabledAnchors:['top-left','top-right','bottom-left','bottom-right','rotater'],
  padding:6, borderStroke:'#0B4EA2', borderStrokeWidth:1.5,
  anchorSize:20, anchorCornerRadius:12,
  anchorStroke:'#0B4EA2', anchorFill:'#fff',
  rotateAnchorOffset:56,
  ignoreStroke:true,
  boundBoxFunc:(oldBox, newBox) => newBox.width < 20 || newBox.height < 20 ? oldBox : newBox,
});
drawLayer.add(transformer);
let selectedNode = null, currentTool = 'select', currentShape = null;

/* ============ Sizing ============ */
function sizeToWrapper(){
  const wrap = document.getElementById('canvas-wrapper');
  if(!wrap) return;
  STAGE_W = Math.max(200, wrap.clientWidth);
  STAGE_H = Math.max(200, wrap.clientHeight);
  stage.size({ width:STAGE_W, height:STAGE_H });
  stage.container().style.width = STAGE_W + 'px';
  stage.container().style.height = STAGE_H + 'px';
}
function resizeStage(w,h){
  stage.size({ width:w, height:h });
  stage.container().style.width = w+'px';
  stage.container().style.height = h+'px';
}

/* ============ Selection ============ */
function selectNode(n){
  selectedNode = n;
  transformer.nodes(n ? [n] : []);
  transformer.visible(!!n);
  transformer.moveToTop();
  drawLayer.draw();
  syncStrokeField();
  updateZButtons();
}
function refreshDraggables(){
  const drag = currentTool === 'select';
  drawLayer.getChildren(n => n !== transformer).forEach(n => n.draggable(drag));
}

/* ============ Color ============ */
let currentColor = COLORS.green;
function applyColorToSelected(){
  if(!selectedNode) return;
  const c = selectedNode.className;
  if(c === 'Text'){ selectedNode.fill(currentColor); }
  else if(c === 'Line' || c === 'Rect'){ selectedNode.stroke(currentColor); }
  else if(c === 'Arrow'){ selectedNode.stroke(currentColor); selectedNode.fill(currentColor); }
}
function setColor(name){
  currentColor = COLORS[name];
  chipEls.forEach(b => b.classList.toggle('active', b.dataset.color === name));
  if(selectedNode){
    applyColorToSelected();
    drawLayer.draw(); commitHistory(); saveScene(); isDirty = false;
  }
}
chipEls.forEach(b => b.addEventListener('click', () => setColor(b.dataset.color)));
document.getElementById('customColor').addEventListener('input', e => {
  currentColor = e.target.value;
  chipEls.forEach(b => b.classList.remove('active'));
  if(selectedNode){ applyColorToSelected(); drawLayer.batchDraw(); }
});
document.getElementById('customColor').addEventListener('change', () => {
  if(selectedNode){ commitHistory(); saveScene(); isDirty = false; }
});
setColor('green');

/* ============ Toggles ============ */
const snapToggle = document.getElementById('snapToggle');
let snapEnabled = snapToggle.checked;
snapToggle.addEventListener('change', () => snapEnabled = snapToggle.checked);
const dashToggle = document.getElementById('dashToggle');
const doubleArrow = document.getElementById('doubleArrowToggle');
const rectFillToggle = document.getElementById('rectFillToggle');
const penOnlyToggle = document.getElementById('penOnlyToggle');
const pressureToggle = document.getElementById('pressureToggle');

dashToggle.addEventListener('change', () => {
  if(selectedNode && (selectedNode.className === 'Line' || selectedNode.className === 'Arrow')){
    selectedNode.dash(dashToggle.checked ? [8,6] : []);
    drawLayer.batchDraw(); setDirty(); commitHistory(); saveScene(); isDirty = false;
  }
});
doubleArrow.addEventListener('change', () => {
  if(selectedNode && selectedNode.className === 'Arrow'){
    selectedNode.pointerAtBeginning(!!doubleArrow.checked);
    drawLayer.batchDraw(); setDirty(); commitHistory(); saveScene(); isDirty = false;
  }
});

/* ============ Stroke width ============ */
const strokeInput = document.getElementById('strokeWidth');
function syncStrokeField(){
  if(!selectedNode) return;
  if(['Line','Arrow','Rect'].includes(selectedNode.className)){
    strokeInput.value = Math.round(selectedNode.strokeWidth() || 3);
  }
}
strokeInput.addEventListener('input', () => {
  if(selectedNode && ['Line','Arrow','Rect'].includes(selectedNode.className)){
    const v = Math.max(1, Math.min(50, parseInt(strokeInput.value)||1));
    selectedNode.strokeWidth(v);
    setDirty(); drawLayer.batchDraw();
  }
});
strokeInput.addEventListener('change', () => {

/* ============ Node selection ============ */
function enableSelect(node){
  node.on('pointerdown', e => {
    if(currentTool === 'select') selectNode(node);
  });
  node.on('dragmove', setDirty);
  node.on('transform', setDirty);
  node.on('dragend transformend', () => {
    transformer.moveToTop();
    commitHistory(); saveScene(); isDirty = false;
  });
}

/* ============ Snap ============ */
function nearestSnapPoint(p, thr){
  thr = thr || 16;
  if(!snapEnabled) return null;
  let best = null, bd = thr*thr;
  drawLayer.getChildren(n => n !== transformer).forEach(s => {
    if(s === currentShape) return;
    if(s.className === 'Line' || s.className === 'Arrow'){
      const pts = s.points();
      for(let i=0; i<pts.length; i+=2){
        const dx = p.x - pts[i], dy = p.y - pts[i+1];
        const d = dx*dx + dy*dy;
        if(d <= bd){ bd = d; best = { x:pts[i], y:pts[i+1] }; }
      }
    }
  });
  return best;
}

/* ============ Pointer handling ============ */
function getPointerType(e){
  const evt = e.evt || {};
  return evt.pointerType || 'mouse';  // 'pen' | 'touch' | 'mouse'
}
function getPressure(e){
  const evt = e.evt || {};
  const p = evt.pressure;
  if(typeof p === 'number' && p > 0 && p < 1) return p;  // Apple Pencil gives real values
  if(p === 1) return 1;
  return 0;
}
function shouldDrawWith(e){
  const type = getPointerType(e);
  if(type === 'pen') return true;
  if(type === 'touch' && !penOnlyToggle.checked) return true;
  if(type === 'mouse') return true;
  return false;
}

/* ============ Drawing events ============ */
let rafPending = false, pendingPointer = null;
function scheduleDraw(){
  if(rafPending) return;
  rafPending = true;
  requestAnimationFrame(() => {
    rafPending = false;
    if(pendingPointer && currentShape) updateCurrentShape(pendingPointer);
    pendingPointer = null;
  });
}

function updateCurrentShape(pos){
  if(currentTool === 'line' || currentTool === 'arrow'){
    const pts = currentShape.points();
    pts.push(pos.x, pos.y);
    // Simplify: keep every 2nd point if too many
    if(pts.length > 400){
      const reduced = [];
      for(let i=0; i<pts.length; i+=4) reduced.push(pts[i], pts[i+1]);
      reduced.push(pts[pts.length-2], pts[pts.length-1]);
      currentShape.points(reduced);
    } else {
      currentShape.points(pts);
    }
  } else if(currentTool === 'rect'){
    currentShape.width(pos.x - currentShape.x());
    currentShape.height(pos.y - currentShape.y());
  }
}

stage.on('pointerdown', e => {
  const type = getPointerType(e);
  const pressure = getPressure(e);
  penState.lastType = type;
  penState.lastPressure = pressure;
  penState.active = true;

  if(type === 'pen') setPenIndicator('Pen actief', true);
  else if(type === 'touch') setPenIndicator('Vinger', false);

  // Palm rejection: if pen-only and it's a touch, ignore drawing on empty canvas
  if(!shouldDrawWith(e)){
    // but still allow selection taps
    if(e.target === stage || e.target.getLayer() === bgLayer) selectNode(null);
    return;
  }

  if(e.target === stage || e.target.getLayer() === bgLayer){
    if(currentTool !== 'select') selectNode(null);
  }

  // Only handle creation when on bg/stage
  if(e.target !== stage && e.target.getLayer() !== bgLayer) return;

  const baseW = parseInt(strokeInput.value) || 3;
  const dashed = dashToggle.checked ? [8,6] : [];
  let pos = stage.getPointerPosition();
  if(!pos) return;
  const s = nearestSnapPoint(pos, 18);
  if(s) pos = s;

  const usePressure = pressureToggle.checked && type === 'pen' && pressure > 0;
  const sw = usePressure
    ? Math.max(1, baseW * (0.35 + pressure * 1.6))
    : baseW;

  if(currentTool === 'line'){
    currentShape = new Konva.Line({
      points:[pos.x, pos.y],
      stroke:currentColor, strokeWidth:sw,
      dash:dashed, lineCap:'round', lineJoin:'round',
      tension:0.35,
      hitStrokeWidth:24,
      perfectDrawEnabled:false,
      shadowForStrokeEnabled:false,
    });
    drawLayer.add(currentShape);
    enableSelect(currentShape);
    document.getElementById('canvas-wrapper').classList.add('drawing');
  } else if(currentTool === 'arrow'){
    currentShape = new Konva.Arrow({
      points:[pos.x, pos.y, pos.x, pos.y],
      stroke:currentColor, fill:currentColor, strokeWidth:sw,
      dash:dashed,
      pointerLength:14, pointerWidth:14,
      pointerAtBeginning:!!doubleArrow.checked,
      hitStrokeWidth:24,
      perfectDrawEnabled:false,
      shadowForStrokeEnabled:false,
    });
    drawLayer.add(currentShape);
    enableSelect(currentShape);
    document.getElementById('canvas-wrapper').classList.add('drawing');
  } else if(currentTool === 'rect'){
    currentShape = new Konva.Rect({
      x:pos.x, y:pos.y, width:1, height:1,
      stroke:currentColor, strokeWidth:sw,
      fill:rectFillToggle.checked ? '#FFFFFF' : undefined,
      perfectDrawEnabled:false,
      shadowForStrokeEnabled:false,
    });
    drawLayer.add(currentShape);
    enableSelect(currentShape);
    document.getElementById('canvas-wrapper').classList.add('drawing');
  } else if(currentTool === 'text'){
    const t = new Konva.Text({
      x:pos.x, y:pos.y, text:'Nieuwe tekst',
      fontSize:20, fill:currentColor, draggable:true, padding:4,
    });
    t.on('dblclick dbltap', () => {
      const val = prompt('Wijzig tekst', t.text());
      if(val !== null){ t.text(val); commitHistory(); saveScene(); }
      drawLayer.batchDraw();
    });
    drawLayer.add(t); enableSelect(t); selectNode(t);
    setTool('select');
    commitHistory(); saveScene();
  }
});

stage.on('pointermove', e => {
  if(!currentShape) return;
  const type = getPointerType(e);
  const pressure = getPressure(e);

  // live pressure modulation
  if(pressureToggle.checked && type === 'pen' && pressure > 0 && currentShape.className !== 'Text'){
    const baseW = parseInt(strokeInput.value) || 3;
    currentShape.strokeWidth(Math.max(1, baseW * (0.35 + pressure * 1.6)));
  }

  // snap
  let pos = stage.getPointerPosition();
  if(!pos) return;
  const s = nearestSnapPoint(pos, 18);
  if(s) pos = s;

  pendingPointer = pos;
  scheduleDraw();
});

function endDraw(e){
  if(!currentShape) return;
  // for line/arrow we need at least a tiny movement, otherwise remove stub
  if(currentShape.className === 'Line' || currentShape.className === 'Arrow'){
    const pts = currentShape.points();
    if(pts.length < 4){
      currentShape.destroy();
      currentShape = null;
      document.getElementById('canvas-wrapper').classList.remove('drawing');
      drawLayer.batchDraw();
      return;
    }
  }
  currentShape = null;
  document.getElementById('canvas-wrapper').classList.remove('drawing');
  commitHistory(); saveScene(); isDirty = false;
}
stage.on('pointerup pointercancel', endDraw);
stage.on('contentPointerup contentPointercancel', endDraw);

function newId(){ return 'img-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2,8); }

async function handleFiles(files){
  if(!files || !files.length) return;
  const items = await Promise.all(files.map(f => new Promise(res => {
    const fr = new FileReader();
    fr.onload = () => {
      const im = new Image();
      im.onload = () => res({ id:newId(), name:f.name, dataURL:fr.result, w:im.naturalWidth, h:im.naturalHeight });
      im.onerror = () => res(null);
      im.src = fr.result;
    };
    fr.onerror = () => res(null);
    fr.readAsDataURL(f);
  })));
  const good = items.filter(Boolean);
  if(!good.length) return;

  const had = imageFiles.length > 0;
  if(!had){
    if(drawLayer.getChildren(n => n !== transformer).length) clearLayer();
    imageFiles = good;
    currentIndex = 0; currentId = good[0].id;
    good.forEach(it => { scenes[it.id] = EMPTY_JSON; history[it.id] = { past:[], future:[] }; });
  } else {
    selectNode(null); flushAndSave();
    imageFiles = imageFiles.concat(good);
    good.forEach(it => { scenes[it.id] = EMPTY_JSON; history[it.id] = { past:[], future:[] }; });
  }
  renderThumbs();
  loadImageAt(currentIndex);
}

function renderThumbs(){
  thumbsEl.innerHTML = '';
  imageFiles.forEach((f, i) => {
    const b = document.createElement('button');
    b.className = 'thumb-btn' + (i === currentIndex ? ' active' : '');
    b.textContent = String(i+1);
    b.title = f.name;
    b.addEventListener('click', () => {
      if(currentIndex >= 0){ selectNode(null); flushAndSave(); }
      currentIndex = i; currentId = f.id;
      loadImageAt(i); renderThumbs();
    });
    thumbsEl.appendChild(b);
  });
}

function fitImageToStage(meta){
  if(!meta){
    bgImageNode.image(null); bgLayer.draw();
    resizeStage(STAGE_W, STAGE_H);
    return;
  }
  const img = new Image();
  img.onload = () => {
    sizeToWrapper();
    const scale = STAGE_H / meta.h;
    const iw = meta.w * scale, ih = STAGE_H;
    const sw = Math.max(STAGE_W, Math.ceil(iw));
    resizeStage(sw, STAGE_H);
    const ix = Math.max(0, (sw - iw) / 2);
    bgImageNode.setAttrs({ image:img, x:ix, y:0, width:iw, height:ih });
    bgLayer.draw();
    centerViewportOnBg();
  };
  img.src = meta.dataURL;
}
function centerViewportOnBg(){
  const wrap = document.getElementById('canvas-wrapper');
  const cx = bgImageNode.x() + bgImageNode.width()/2;
  wrap.scrollLeft = Math.max(0, cx - wrap.clientWidth/2);
}

function loadImageAt(i){
  if(i < 0 || !imageFiles[i]) return;
  const meta = imageFiles[i];
  currentId = meta.id;
  fitImageToStage(meta);
  curName.textContent = meta.name || '–';
  applyJSON(scenes[currentId] || EMPTY_JSON);
  ensureHistory(currentId);
  updateUndoRedo();
  renderThumbs();
}

function switchImage(d){
  if(!imageFiles.length) return;
  if(currentIndex >= 0){ selectNode(null); flushAndSave(); }
  currentIndex = (currentIndex + d + imageFiles.length) % imageFiles.length;
  currentId = imageFiles[currentIndex].id;
  loadImageAt(currentIndex);
}
btnPrev.addEventListener('click', () => switchImage(-1));
btnNext.addEventListener('click', () => switchImage(1));

document.getElementById('btn-remove-photo').addEventListener('click', () => {
  if(currentIndex < 0) return;
  const removed = imageFiles.splice(currentIndex, 1)[0];
  if(removed){ delete scenes[removed.id]; delete history[removed.id]; }
  if(!imageFiles.length){
    currentIndex = -1; currentId = null;
    fitImageToStage(null); clearLayer();
    curName.textContent = '–'; thumbsEl.innerHTML = '';
    return;
  }
  if(currentIndex >= imageFiles.length) currentIndex = imageFiles.length-1;
  currentId = imageFiles[currentIndex].id;
  loadImageAt(currentIndex);
});

document.getElementById('btn-clear-queue').addEventListener('click', () => {
  if(!confirm("Ben je zeker dat je alle foto's wil wissen?")) return;
  imageFiles = []; currentIndex = -1; currentId = null;
  fitImageToStage(null); clearLayer();
  curName.textContent = '–'; thumbsEl.innerHTML = '';
  const fi = document.getElementById('file-input'); if(fi) fi.value = '';
});

document.getElementById('btn-rename-photo').addEventListener('click', () => {
  if(currentIndex < 0) return;
  const cur = imageFiles[currentIndex];
  const base = cur.name ? cur.name.replace(/\.[^.]+$/, '') : 'beeld-'+(currentIndex+1);
  const nieuw = prompt('Nieuwe bestandsnaam (zonder extensie):', base);

  const safe = nieuw.replace(/[^\w\-\.\s]/g, '_');

});

/* ============ History ============ */
function snapshot(){
  const layer = transformer.getLayer();
  transformer.remove();
  const json = drawLayer.toJSON();
  layer.add(transformer); transformer.moveToTop();
  return json;
}
function applyJSON(json){
  clearLayer();
  if(json){
    try{
      const temp = Konva.Node.create(json);
      temp.getChildren().toArray().forEach(ch => { drawLayer.add(ch); enableSelect(ch); });
      temp.destroy();
    }catch(e){ logErr('JSON', String(e && e.message || e)); }
  }
  drawLayer.add(transformer);
  drawLayer.draw();
  selectNode(null);
}
function clearLayer(){
  const layer = transformer.getLayer();
  transformer.remove();
  drawLayer.destroyChildren();
  layer.add(transformer);
  drawLayer.draw();
}
function saveScene(){ if(currentId) scenes[currentId] = snapshot(); }
function ensureHistory(id){ if(!history[id]) history[id] = { past:[], future:[] }; }
function commitHistory(){
  if(!currentId) return;
  ensureHistory(currentId);
  const json = snapshot();
  const h = history[currentId];
  if(!h.past.length || h.past[h.past.length-1] !== json){
    h.past.push(json);
    if(h.past.length > 100) h.past.shift();
    h.future = [];
    scenes[currentId] = json;
    updateUndoRedo();
  }
}
function undo(){
  if(!currentId) return;
  const h = history[currentId];
  if(!h || h.past.length <= 1) return;
  const cur = h.past.pop(); h.future.push(cur);
  const prev = h.past[h.past.length-1];
  applyJSON(prev); scenes[currentId] = prev;
  updateUndoRedo();
}
function redo(){
  if(!currentId) return;
  const h = history[currentId];
  if(!h || !h.future.length) return;
  const next = h.future.pop(); h.past.push(next);
  applyJSON(next); scenes[currentId] = next;
  updateUndoRedo();
}
function updateUndoRedo(){
  const h = history[currentId];
  document.getElementById('btn-undo').disabled = !(h && h.past.length > 1);
  document.getElementById('btn-redo').disabled = !(h && h.future.length > 0);
}
document.getElementById('btn-undo').addEventListener('click', undo);
document.getElementById('btn-redo').addEventListener('click', redo);

/* ============ Symbols ============ */
function addSymbol(type){
  const def = SYMBOLS[type];
  if(!def) return;
  const g = new Konva.Group({ x:120, y:120, draggable:true });
  if(def.shape === 'circle'){
    g.add(new Konva.Circle({
      radius:24, stroke:def.stroke, strokeWidth:3.5,
      fill:'rgba(0,0,0,0.001)', hitStrokeWidth:28,
    }));
  } else {
    g.add(new Konva.Rect({
      width:def.w, height:def.h, fill:def.bg, stroke:'#000', strokeWidth:1.5,
    }));
    g.add(new Konva.Text({
      text:def.label, fontSize:def.fs || 16, fontStyle:'bold',
      fill:def.fg || '#000',
      width:def.w, height:def.h, align:'center', verticalAlign:'middle',
      listening:false,
    }));
  }
  drawLayer.add(g); enableSelect(g); selectNode(g);
  setTool('select'); drawLayer.draw();
  setDirty(); commitHistory(); saveScene(); isDirty = false;
}

/* ============ Export ============ */
function dataURLToBlob(dataURL){
  const commaIndex = dataURL.indexOf(',');
  if(commaIndex === -1) throw new Error('Invalid dataURL');
  const base64 = dataURL.substring(commaIndex+1);
  const byteString = atob(base64);
  const arr = new Uint8Array(byteString.length);
  for(let i=0; i<byteString.length; i++) arr[i] = byteString.charCodeAt(i);
  const mime = (dataURL.substring(0, commaIndex).match(/:(.*?);/) || [])[1] || 'image/jpeg';
  return new Blob([arr], { type:mime });
}
async function compressToJpeg(dataURL, maxKB){
  maxKB = maxKB || 500;
  const img = new Image();
  img.src = dataURL;
  await new Promise((res, rej) => { img.onload = res; img.onerror = rej; });
  const canvas = document.createElement('canvas');
  canvas.width = img.width; canvas.height = img.height;
  canvas.getContext('2d').drawImage(img, 0, 0);
  let quality = 0.85;
  const maxBytes = maxKB*1024;
  let blob;
  do {
    blob = dataURLToBlob(canvas.toDataURL('image/jpeg', quality));
    if(blob.size <= maxBytes || quality <= 0.4) break;
    quality -= 0.05;
  } while(quality > 0.4);
  return blob;
}
async function exportCroppedURL(){
  for(let i=0; i<40; i++){
    try{
      const im = bgImageNode.image && bgImageNode.image();
      if(im && im.complete && im.naturalWidth > 0) break;
    }catch(_){}
    await new Promise(r => setTimeout(r, 30));
  }
  const rect = bgImageNode.getClientRect({ skipShadow:true, skipStroke:true });
  if(!rect || !rect.width || !rect.height){
    return stage.toDataURL({ mimeType:'image/png' });
  }
  const im = bgImageNode.image && bgImageNode.image();
  const pr = (im && rect.width) ? (im.naturalWidth / rect.width) : 1;
  const prev = transformer.nodes();
  transformer.visible(false); transformer.nodes([]);
  drawLayer.draw();
  await new Promise(r => setTimeout(r, 20));
  const url = stage.toDataURL({
    mimeType:'image/png', x:rect.x, y:rect.y, width:rect.width, height:rect.height,
    pixelRatio:Math.max(1, pr),
  });
  transformer.visible(true); transformer.nodes(prev);
  drawLayer.draw();
  return url;
}
function downloadBlob(name, blob){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 800);
}
document.getElementById('btn-export').addEventListener('click', async () => {
  try{
    const url = await exportCroppedURL();
    const blob = await compressToJpeg(url, 500);
    const base = (currentIndex >= 0 && imageFiles[currentIndex] && imageFiles[currentIndex].name)
      ? imageFiles[currentIndex].name.replace(/\.[^.]+$/,'') : 'tekening';
    downloadBlob(base + '-annotated.jpg', blob);
  }catch(e){ logErr('Export JPEG', String(e && e.message || e)); }
});

/* Simple ZIP */
function SimpleZip(){ this.parts=[]; this.files=[]; this.size=0; }
function CRC32(){
  if(!CRC32.table){
    CRC32.table = new Uint32Array(256);
    for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1); CRC32.table[n]=c>>>0; }
  }
  this.crc = ~0;
}
CRC32.prototype.update = function(arr){
  const t = CRC32.table; let c = this.crc;
  for(let i=0;i<arr.length;i++) c = t[(c^arr[i])&255]^(c>>>8);
  this.crc = c;
};
CRC32.prototype.digest = function(){ return (~this.crc)>>>0; };
function le16(v){ return new Uint8Array([v&255,(v>>>8)&255]); }
function le32(v){ return new Uint8Array([v&255,(v>>>8)&255,(v>>>16)&255,(v>>>24)&255]); }
function dosTime(dt){
  dt = dt || new Date();
  const time = (dt.getHours()<<11)|(dt.getMinutes()<<5)|(Math.floor(dt.getSeconds()/2));
  const date = ((dt.getFullYear()-1980)<<9)|((dt.getMonth()+1)<<5)|dt.getDate();
  return { time, date };
}
SimpleZip.prototype.add = function(name, bytes, mtime){
  if(!(bytes instanceof Uint8Array)) bytes = new Uint8Array(bytes);
  const enc = new TextEncoder();
  const nb = enc.encode(name);
  const ts = dosTime(mtime);
  const c = new CRC32(); c.update(bytes);
  const crc = c.digest()>>>0;
  const local = [le32(0x04034b50), le16(20), le16(0), le16(0), le16(ts.time), le16(ts.date),
    le32(crc), le32(bytes.length), le32(bytes.length), le16(nb.length), le16(0), nb];
  let L=0; for(const p of local) L+=p.length;
  const lh = new Uint8Array(L);
  let o=0; for(const p of local){ lh.set(p,o); o+=p.length; }
  this.parts.push(lh, bytes);
  const off = this.size;
  this.size += lh.length + bytes.length;
  this.files.push({ nb, ts, crc, size:bytes.length, off });
};
SimpleZip.prototype.render = function(){
  const central = []; let centralSize = 0;
  for(const f of this.files){
    const cd = [le32(0x02014b50), le16(20), le16(20), le16(0), le16(0),
      le16(f.ts.time), le16(f.ts.date), le32(f.crc), le32(f.size), le32(f.size),
      le16(f.nb.length), le16(0), le16(0), le16(0), le16(0), le32(0), le32(f.off), f.nb];
    let L=0; for(const p of cd) L+=p.length;
    const buf = new Uint8Array(L);
    let o=0; for(const p of cd){ buf.set(p,o); o+=p.length; }
    central.push(buf); centralSize += L;
  }
  const eocd = new Uint8Array(22);
  let o=0;
  eocd.set(le32(0x06054b50), o); o+=4;
  eocd.set(le16(0), o); o+=2;
  eocd.set(le16(0), o); o+=2;
  eocd.set(le16(this.files.length), o); o+=2;
  eocd.set(le16(this.files.length), o); o+=2;
  eocd.set(le32(centralSize), o); o+=4;
  eocd.set(le32(this.size), o); o+=4;
  eocd.set(le16(0), o); o+=2;
  const all = [...this.parts, ...central, eocd];
  let sum=0; for(const p of all) sum+=p.length;
  const out = new Uint8Array(sum);
  let pos=0; for(const p of all){ out.set(p,pos); pos+=p.length; }
  return new Blob([out], { type:'application/zip' });
};

document.getElementById('btn-export-all').addEventListener('click', async () => {
  if(!imageFiles.length) return;
  const zip = new SimpleZip();
  const prevIndex = currentIndex;
  const includeJson = document.getElementById('includeProjectJson').checked;
  for(let i=0; i<imageFiles.length; i++){
    if(currentIndex !== i){
      if(currentIndex >= 0){ selectNode(null); flushAndSave(); }
      currentIndex = i; currentId = imageFiles[i].id;
      loadImageAt(i);
    }
    await new Promise(r => setTimeout(r, 80));
    try{
      const url = await exportCroppedURL();
      const blob = await compressToJpeg(url, 500);
      const arr = new Uint8Array(await blob.arrayBuffer());
      const base = (imageFiles[i].name || ('beeld-'+(i+1))).replace(/\.[^.]+$/,'');
      zip.add(base + '.jpg', arr, new Date());
    }catch(e){ logErr('ZIP item '+i, String(e && e.message || e)); }
  }
  if(includeJson){
    flushAndSave();
    const imgs = imageFiles.map(it => ({ id:it.id, name:it.name, dataURL:it.dataURL, w:it.w, h:it.h }));
    const sc = {}; imgs.forEach(it => { sc[it.id] = scenes[it.id] || EMPTY_JSON; });
    const data = { version:2, projectName:(document.getElementById('projectName').value||'').trim(), images:imgs, scenes:sc };
    const jsonBlob = new Blob([JSON.stringify(data)], { type:'application/json' });
    zip.add('project.json', new Uint8Array(await jsonBlob.arrayBuffer()), new Date());
  }
  downloadBlob('export.zip', zip.render());
  if(prevIndex >= 0) loadImageAt(prevIndex);
});

/* ============ Project ============ */
document.getElementById('btn-export-project').addEventListener('click', () => {
  try{
    flushAndSave();
    const imgs = imageFiles.map(it => ({ id:it.id, name:it.name, dataURL:it.dataURL, w:it.w, h:it.h }));
    const sc = {}; imgs.forEach(it => { sc[it.id] = scenes[it.id] || EMPTY_JSON; });
    const data = { version:2, projectName:(document.getElementById('projectName').value||'').trim(), images:imgs, scenes:sc };
    const base = (document.getElementById('projectName').value || 'project')
      .replace(/[\\/:*?"<>|]+/g,'_').replace(/\s+/g,' ').trim() || 'project';
    downloadBlob(base + '.json', new Blob([JSON.stringify(data, null, 2)], { type:'application/json' }));
  }catch(e){ logErr('Project opslaan', String(e && e.message || e)); }
});
const projInput = document.getElementById('project-input');
document.getElementById('btn-load-project').addEventListener('click', () => projInput.click());
projInput.addEventListener('change', async e => {
  try{
    const file = (e.target.files||[])[0];
    if(!file) return;
    const data = JSON.parse(await file.text());
    if(!data || !Array.isArray(data.images)){ logErr('Project','Geen geldige JSON'); e.target.value=''; return; }
    selectNode(null); clearLayer();
    const imgs = data.images.map((it, i) => ({
      id: it.id || newId(),
      name: it.name || ('beeld-'+(i+1)+'.png'),
      dataURL: it.dataURL || '', w: it.w || 0, h: it.h || 0,
    }));
    imageFiles = imgs;
    for(const k in scenes) delete scenes[k];
    for(const it of imgs){
      scenes[it.id] = (data.scenes && typeof data.scenes[it.id] === 'string') ? data.scenes[it.id] : EMPTY_JSON;
      history[it.id] = { past:[], future:[] };
    }
    currentIndex = imgs.length ? 0 : -1;
    currentId = imgs.length ? imgs[0].id : null;
    document.getElementById('projectName').value = data.projectName || '';
    renderThumbs();
    if(imgs.length) loadImageAt(0);
    else { fitImageToStage(null); curName.textContent = '–'; }
    e.target.value = '';
    logErr('OK', 'Project geladen (' + imgs.length + ' beelden)');
  }catch(err){
    logErr('Project laden', String(err && err.message || err));
    try{ e.target.value = ''; }catch(_){}
  }
});

/* ============ Drawers ============ */
const body = document.body;
function openDrawer(side){
  body.classList.remove('drawer-left','drawer-right');
  body.classList.add('drawer-' + side);
}
function closeDrawers(){ body.classList.remove('drawer-left','drawer-right'); }
document.getElementById('toggle-left').addEventListener('click', () => {
  body.classList.contains('drawer-left') ? closeDrawers() : openDrawer('left');
});
document.getElementById('toggle-right').addEventListener('click', () => {
  body.classList.contains('drawer-right') ? closeDrawers() : openDrawer('right');
});
document.querySelectorAll('.close-x').forEach(b => b.addEventListener('click', closeDrawers));
document.getElementById('backdrop').addEventListener('click', closeDrawers);

/* ============ Resize ============ */
function handleResize(){
  const meta = imageFiles[currentIndex];
  sizeToWrapper();
  if(meta) fitImageToStage(meta);
}
if(window.ResizeObserver){
  const ro = new ResizeObserver(() => {
    if(ro._t) cancelAnimationFrame(ro._t);
    ro._t = requestAnimationFrame(handleResize);
  });
  ro.observe(document.getElementById('canvas-wrapper'));
} else {
  window.addEventListener('resize', handleResize);
  window.addEventListener('orientationchange', () => setTimeout(handleResize, 300));
}
requestAnimationFrame(() => sizeToWrapper());
window.addEventListener('load', () => setTimeout(sizeToWrapper, 100));

/* Prevent iOS double-tap zoom while drawing */
document.addEventListener('gesturestart', e => e.preventDefault());
let lastTouchEnd = 0;
document.addEventListener('touchend', e => {
  const now = Date.now();
  if(now - lastTouchEnd <= 300 && e.target.closest && e.target.closest('#canvas-wrapper')) e.preventDefault();
  lastTouchEnd = now;
}, { passive:false });

console.log('Tekenapp gereed (Apple Pencil mode)');
})();
